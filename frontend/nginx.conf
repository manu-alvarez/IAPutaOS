server {
    listen 80;
    server_name _;

    # SPA Vue/React
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Non-sensitive health endpoint for local supervision.
    location = /health {
        proxy_pass http://iaputa-backend:8000/health;
        proxy_set_header Host $host;
    }

    # Proxy reverso para la API (FastAPI)
    location /api/ {
        proxy_pass http://iaputa-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key ${IAPUTA_API_KEY};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy multimedia
    location /temp_audio/ {
        proxy_pass http://iaputa-backend:8000;
        proxy_set_header Host $host;
    }

    location /temp_vision/ {
        proxy_pass http://iaputa-backend:8000;
        proxy_set_header Host $host;
    }
}
